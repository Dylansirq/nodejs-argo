<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阳光少年 - 中学生课外体育锻炼指南</title>
    <style>
        /* 全局样式重置与主题色 */
        :root {
            --primary-color: #ff6b6b; /* 活力橙红 */
            --secondary-color: #4ea8de; /* 运动蓝 */
            --dark-color: #2b2d42;
            --light-color: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: var(--dark-color);
            line-height: 1.6;
        }

        /* 导航栏 */
        header {
            background: linear-gradient(135deg, var(--primary-color), #ff8787);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 主体布局 */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 通用卡片样式 */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: var(--dark-color);
            border-left: 5px solid var(--secondary-color);
            padding-left: 10px;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* 锻炼计划表格 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }

        th {
            background-color: #eaf4f9;
            color: var(--secondary-color);
            font-weight: bold;
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: white;
        }
        .tag-aerobic { background-color: #4caf50; }
        .tag-strength { background-color: #ff9800; }
        .tag-flex { background-color: #9c27b0; }

        /* 互动打卡区 */
        .punch-box {
            background: linear-gradient(135deg, #e6fffa, #e6f6ff);
            border: 2px dashed var(--secondary-color);
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(78, 168, 222, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #3a8ebd;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 健康贴士列表 */
        .tips-list {
            list-style: none;
        }

        .tips-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 15px;
        }

        .tips-list li::before {
            content: "💡";
            position: absolute;
            left: 0;
            top: 0;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 50px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏃‍♂️ 阳光少年课外体育锻炼网</h1>
        <p>每天锻炼一小时，健康生活一辈子！科学运动，乐享青春。</p>
    </header>

    <div class="container">
        
        <main>
            <div class="card">
                <h2>✨ 推荐锻炼项目</h2>
                <p style="margin-bottom: 15px; color: #666;">根据《国家学生体质健康标准》，推荐中学生开展以下既能应试又能强身健体的运动项目：</p>
                <table>
                    <thead>
                        <tr>
                            <th>运动项目</th>
                            <th>运动类别</th>
                            <th>建议时间</th>
                            <th>运动功效</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>中长跑 (800m/1000m)</strong></td>
                            <td><span class="tag tag-aerobic">有氧耐力</span></td>
                            <td>每周 2-3 次</td>
                            <td>提升心肺功能，增强意志力</td>
                        </tr>
                        <tr>
                            <td><strong>跳绳 / 1分钟仰卧起坐</strong></td>
                            <td><span class="tag tag-strength">力量爆发</span></td>
                            <td>每天 15 分钟</td>
                            <td>协调全身肌肉，提升体考成绩</td>
                        </tr>
                        <tr>
                            <td><strong>篮球 / 羽毛球 / 足球</strong></td>
                            <td><span class="tag tag-aerobic">团队竞技</span></td>
                            <td>周末 60-90 分钟</td>
                            <td>缓解学习压力，培养团队协作</td>
                        </tr>
                        <tr>
                            <td><strong>体前屈 / 拉伸操</strong></td>
                            <td><span class="tag tag-flex">柔韧协调</span></td>
                            <td>运动后 10 分钟</td>
                            <td>防止肌肉酸痛，塑造良好体态</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2>📅 科学运动三部曲</h2>
                <div style="margin-top: 10px;">
